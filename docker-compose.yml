services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heatshield
      POSTGRES_PASSWORD: heatshield
      POSTGRES_DB: heatshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatshield -d heatshield"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
